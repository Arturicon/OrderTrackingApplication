services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orderDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d freedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      
      
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: ./Backend
    container_name: backend_container
    environment:
      - ASPNETCORE_ENVIRONMENT=Production  
      - CORS_ORIGINS=http://localhost:5171;http://frontend_container:80 
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  notifyservice:
    build: ./NotifyService
    container_name: notification_container
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "5010:8080"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend_container
    depends_on:
      - backend
      - notifyservice
    ports:
      - "3000:80"
    networks:
      - app-network
    
volumes:
  postgres_data:
  rabbitmq_data:
      
networks:
  app-network:
    driver: bridge